[project]
name = "finalproject-arutyunov-m26-555"
version = "0.1.0"
description = "Console application for currency trading platform simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
default_base_currency = "USD"
rates_ttl_seconds = 300
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_file = "logs/actions.log"
log_rotation = "time"
log_backup_count = 7
log_file_size = 1048576